<mat-card>
  <mat-card-header>
    <mat-card-title>
      {{ editando ? 'Editar Tarefa' : 'Nova Tarefa' }}
    </mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <form [formGroup]="form" (ngSubmit)="salvar()">

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Título</mat-label>
        <input matInput formControlName="titulo" />
        <mat-error *ngIf="form.get('titulo')?.hasError('required')">
          O título é obrigatório.
        </mat-error>
        <mat-error *ngIf="form.get('titulo')?.hasError('maxlength')">
          O título deve ter no máximo 100 caracteres.
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Descrição</mat-label>
        <textarea matInput formControlName="descricao"></textarea>
        <mat-error *ngIf="form.get('descricao')?.hasError('maxlength')">
          A descrição deve ter no máximo 300 caracteres.
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Status</mat-label>
        <mat-select formControlName="status">
          <mat-option *ngFor="let status of statusOptions" [value]="status">
            {{ status }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <div class="actions">
        <button mat-raised-button color="primary" type="submit">
          {{ editando ? 'Atualizar' : 'Salvar' }}
        </button>

        <button mat-button type="button" (click)="voltar()">
          Cancelar
        </button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
