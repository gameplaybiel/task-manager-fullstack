<h2 mat-dialog-title>Excluir tarefa</h2>

<mat-dialog-content>
  <p>Deseja realmente excluir a tarefa abaixo?</p>
  <p><strong>{{ data.titulo }}</strong></p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancelar()">Cancelar</button>
  <button mat-raised-button color="warn" (click)="confirmar()">Excluir</button>
</mat-dialog-actions>
