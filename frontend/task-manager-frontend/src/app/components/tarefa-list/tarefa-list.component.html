<mat-card>
  <mat-card-header>
    <mat-card-title>Lista de Tarefas</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <button mat-raised-button color="primary" (click)="novaTarefa()">
      Nova Tarefa
    </button>

    <table mat-table [dataSource]="tarefas" class="mat-elevation-z8 full-width-table">

      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let tarefa">{{ tarefa.id }}</td>
      </ng-container>

      <ng-container matColumnDef="titulo">
        <th mat-header-cell *matHeaderCellDef>Título</th>
        <td mat-cell *matCellDef="let tarefa">{{ tarefa.titulo }}</td>
      </ng-container>

      <ng-container matColumnDef="descricao">
        <th mat-header-cell *matHeaderCellDef>Descrição</th>
        <td mat-cell *matCellDef="let tarefa">{{ tarefa.descricao }}</td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let tarefa">{{ tarefa.status }}</td>
      </ng-container>

      <ng-container matColumnDef="dataCriacao">
        <th mat-header-cell *matHeaderCellDef>Data de Criação</th>
        <td mat-cell *matCellDef="let tarefa">
          {{ tarefa.dataCriacao | date:'dd/MM/yyyy HH:mm' }}
        </td>
      </ng-container>

      <ng-container matColumnDef="acoes">
        <th mat-header-cell *matHeaderCellDef>Ações</th>
        <td mat-cell *matCellDef="let tarefa">
          <button mat-icon-button color="primary" (click)="editarTarefa(tarefa.id)">
            <mat-icon>edit</mat-icon>
          </button>

          <button mat-icon-button color="warn" (click)="deletarTarefa(tarefa.id, tarefa.titulo)">
  <mat-icon>delete</mat-icon>
</button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </mat-card-content>
</mat-card>
